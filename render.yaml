# Render Blueprint - FREE tier backend (24/7 Telegram reminders + Google Calendar sync)
#
# Deploy: push this repo to GitHub, then in Render dashboard: "New +" -> "Blueprint"
# and select the repo. Fill in the `sync: false` env vars afterwards.
#
# FREE TIER + KEEP-ALIVE: free services sleep after ~15 min of inactivity.
# The included GitHub Actions workflow (.github/workflows/keep-alive.yml) pings
# the service every 10 minutes so it stays awake. The reminder queue is also
# sleep-tolerant: anything due while asleep is delivered right after wake-up
# and the daily digest is deduped per day, so nothing is lost or duplicated.
#
# NOTE: free tier has no persistent disk - re-upload course PDFs after a
# redeploy (redeploys only happen when you push new code).

services:
  - type: web
    name: ai-teaching-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    autoDeploy: true
    # Run exactly ONE instance: the Telegram bot uses long-polling, and a
    # second replica would compete for updates and double-send messages.
    numInstances: 1
    envVars:
      - key: DATABASE_URL
        sync: false          # your Neon/Postgres asyncpg URL (sslmode required)
      - key: SYNC_DATABASE_URL
        sync: false          # same host, plain postgres:// (only used by migration script)
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_MODEL
        value: gemini-3.6-flash
      # AI fallback chain (optional but recommended - fills in when primary is rate-limited)
      - key: AI_FALLBACK_1_BASE_URL
        sync: false
      - key: AI_FALLBACK_1_API_KEY
        sync: false
      - key: AI_FALLBACK_1_MODEL
        sync: false
      - key: AI_FALLBACK_2_BASE_URL
        sync: false
      - key: AI_FALLBACK_2_API_KEY
        sync: false
      - key: AI_FALLBACK_2_MODEL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Must match an "Authorized redirect URI" in Google Cloud Console.
      # This is the actual deployed Render URL (name suffixed because the
      # plain name was taken). If you ever rename the service, update this
      # value AND the Google Cloud Console entry to match.
      - key: GOOGLE_REDIRECT_URI
        value: https://ai-teaching-backend-24fj.onrender.com/api/v1/calendar/oauth2callback
      - key: DAILY_DIGEST_ENABLED
        value: "true"
      - key: DAILY_DIGEST_HOUR
        value: "7"
      - key: GOOGLE_CALENDAR_SYNC_ENABLED
        value: "true"
      # Base URL of the dashboard — used to build password-reset links sent
      # via Telegram. Real domain: https://ai-teaching-assistant-eight.vercel.app
      # (no trailing slash needed)
      - key: FRONTEND_URL
        sync: false
      - key: MAX_UPLOAD_SIZE_MB
        value: "500"
      # Scratch dir used while an upload is being processed (files themselves
      # are persisted in the database via Document.file_data, so this only
      # ever holds transient temp files).
      - key: UPLOAD_DIR
        value: /tmp/ai_teaching_uploads